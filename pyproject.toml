[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlseek"
version = "0.1.0"
description = "A natural language to SQL query converter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Suresh Thalluri", email = "admin@leaninnovationlabs.com" }
]
keywords = ["sql", "natural-language", "nlp", "database", "query"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai>=1.106.0,<2",  # Fix CVE-2026-54249 (unvalidated UploadedFile in UI adapters); stay on 1.x
    "python-dotenv>=1.2.2",  # Fix CVE-2026-28684 (symlink following in set_key)
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",  # Fix CVE-2025-71176 (predictable tmpdir symlink attack)
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/leaninnovationlabs/nlseek"
Repository = "https://github.com/leaninnovationlabs/nlseek"
Issues = "https://github.com/leaninnovationlabs/nlseek/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nlseek"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.uv]
constraint-dependencies = [
    "authlib>=1.7.1",  # Fix multiple CVEs: CVE-2026-28490, CVE-2026-28498, CVE-2026-28802, CVE-2025-68158, plus OIDC open redirect
    "protobuf>=6.33.5",  # Fix CVE-2026-0994 (DoS via uncontrolled recursion in ParseDict)
    "cryptography>=50.0.0",  # Fix CVE-2026-69247 (PKCS#7 Bleichenbacher oracle), plus prior cert/buffer/EC CVEs
    "pyasn1>=0.6.4",  # Fix CVE-2026-30922, CVE-2026-23490, CVE-2026-59885 (OID DoS), CVE-2026-59886 (REAL DoS)
    "joserfc>=1.6.8",  # Fix CVE-2026-49852 (empty HMAC key) and CVE-2026-48990 (b64=false payload-size bypass)
    "mcp>=1.28.1",  # Fix task cross-session access, HTTP session principal binding, WebSocket Host/Origin validation
    "pyjwt>=2.13.0",  # Fix CVE-2026-32597 (insufficient crit header validation, auth bypass)
    "aiohttp>=3.14.3",  # Fix CVE-2026-69244 (OOB heap read), CVE-2026-59881 (WS compress), CVE-2026-69243 (WS smuggling), plus prior CVEs
    "anthropic>=0.105.0,<1",  # Keep anthropic 0.x; 1.0 requires httpx2 and breaks pydantic-ai provider wiring
    "python-multipart>=0.0.31",  # Fix CVE-2026-40347 (DoS via large multipart preamble/epilogue)
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
    "requests>=2.33.0",  # Fix CVE-2026-25645 (insecure temp file reuse in extract_zipped_paths)
    "urllib3>=2.7.0",  # Fix GHSA-mf9v-mfxr-j63j (decompression-bomb bypass) and GHSA-qccp-gfcp-xxvc (sensitive header leak on proxy redirect)
    "idna>=3.15",  # Fix CVE-2024-3651 bypass via specially crafted inputs to idna.encode()
    "pygments>=2.20.0",  # Fix ReDoS via inefficient regex for GUID matching
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:pydantic_ai\\._utils",
]
