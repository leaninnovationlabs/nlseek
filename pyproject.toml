[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlseek"
version = "0.1.0"
description = "A natural language to SQL query converter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Suresh Thalluri", email = "admin@leaninnovationlabs.com" }
]
keywords = ["sql", "natural-language", "nlp", "database", "query"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai[anthropic]>=1.56.0",  # Fix CVE-2026-25580 (SSRF) and CVE-2026-25640 (path traversal)
    "python-dotenv>=1.2.2",  # Fix CVE-2026-28684 (symlink following in set_key)
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",  # Fix CVE-2025-71176 (predictable tmpdir symlink attack)
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/leaninnovationlabs/nlseek"
Repository = "https://github.com/leaninnovationlabs/nlseek"
Issues = "https://github.com/leaninnovationlabs/nlseek/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nlseek"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.uv]
constraint-dependencies = [
    "authlib>=1.7.0",  # Fix multiple CVEs: CVE-2026-28490, CVE-2026-28498, CVE-2026-28802, CVE-2025-68158
    "protobuf>=6.33.5",  # Fix CVE-2026-0994 (DoS via uncontrolled recursion in ParseDict)
    "cryptography>=46.0.7",  # Fix CVE-2026-34073 (cert validation bypass), CVE-2026-39892 (buffer overflow), CVE-2026-26007 (EC info disclosure)
    "pyasn1>=0.6.3",  # Fix CVE-2026-30922 (uncontrolled recursion DoS) and CVE-2026-23490 (memory exhaustion DoS)
    "pyjwt>=2.12.0",  # Fix CVE-2026-32597 (insufficient crit header validation, auth bypass)
    "aiohttp>=3.13.4",  # Fix CVE-2026-22815 (trailer headers DoS), CVE-2026-34516 (multipart header bypass), SSRF on Windows
    "python-multipart>=0.0.26",  # Fix CVE-2026-40347 (DoS via large multipart preamble/epilogue)
    "requests>=2.33.0",  # Fix CVE-2026-25645 (insecure temp file reuse in extract_zipped_paths)
    "urllib3>=2.7.0",  # Fix GHSA-mf9v-mfxr-j63j (decompression-bomb bypass) and GHSA-qccp-gfcp-xxvc (sensitive header leak on proxy redirect)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:pydantic_ai\\._utils",
]
