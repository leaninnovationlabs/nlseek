[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlseek"
version = "0.1.0"
description = "A natural language to SQL query converter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Suresh Thalluri", email = "admin@leaninnovationlabs.com" }
]
keywords = ["sql", "natural-language", "nlp", "database", "query"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai>=1.107.7,<2",  # Fix CVE-2026-54249, CVE-2026-107287/107289/107290/107291 (SSRF bypass, web_fetch DoS, OTel content leak); stay on 1.x
    "python-dotenv>=1.2.2",  # Fix CVE-2026-28684 (symlink following in set_key)
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",  # Fix CVE-2025-71176 (predictable tmpdir symlink attack)
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/leaninnovationlabs/nlseek"
Repository = "https://github.com/leaninnovationlabs/nlseek"
Issues = "https://github.com/leaninnovationlabs/nlseek/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nlseek"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.uv]
constraint-dependencies = [
    "authlib>=1.7.1",  # Fix multiple CVEs: CVE-2026-28490, CVE-2026-28498, CVE-2026-28802, CVE-2025-68158, plus OIDC open redirect
    "protobuf>=6.33.5",  # Fix CVE-2026-0994 (DoS via uncontrolled recursion in ParseDict)
    "cryptography>=50.0.0",  # Fix CVE-2026-69247 (PKCS#7 Bleichenbacher oracle), plus prior cert/buffer/EC CVEs
    "pyasn1>=0.6.4",  # Fix CVE-2026-30922, CVE-2026-23490, CVE-2026-59885 (OID DoS), CVE-2026-59886 (REAL DoS)
    "joserfc>=1.6.8",  # Fix CVE-2026-49852 (empty HMAC key) and CVE-2026-48990 (b64=false payload-size bypass)
    "mcp>=1.30.0",  # Fix CVE-2026-59951 (StreamableHTTP session accumulation), plus prior session/WebSocket fixes
    "pyjwt>=2.15.0",  # Fix CVE-2026-102268 (HS/asymmetric key confusion), CVE-2026-101917..103001 (HMAC key bypasses, JWKS redirects, DoS)
    "aiohttp>=3.14.4",  # Fix CVE-2026-111063..111750, GHSA-2g87-pp6c-29x5 (resource exhaustion, request smuggling, cookie scope), plus prior CVEs
    "anthropic>=0.105.0,<1",  # Keep anthropic 0.x; 1.0 requires httpx2 and breaks pydantic-ai provider wiring
    "python-multipart>=0.0.31",  # Fix CVE-2026-40347 (DoS via large multipart preamble/epilogue)
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
    "requests>=2.33.0",  # Fix CVE-2026-25645 (insecure temp file reuse in extract_zipped_paths)
    "urllib3>=2.8.0",  # Fix CVE-2026-97687/97688/97689 (proxy TLS config, unbounded chunk line, deflate loop), plus prior GHSAs
    "idna>=3.15",  # Fix CVE-2024-3651 bypass via specially crafted inputs to idna.encode()
    "pygments>=2.20.0",  # Fix ReDoS via inefficient regex for GUID matching
    "anyio>=4.14.2",  # Fix CVE-2026-63374 (TLSStream IDNA 2003 cert spoofing), CVE-2026-64847 (process-pool stderr hang)
    "multidict>=6.9.1",  # Fix CVE-2026-104874 (items-view reference leak)
    "opentelemetry-api>=1.45.1",  # Fix CVE-2026-114603 (unbounded tracestate parsing)
    "fastmcp>=3.4.10",  # Fix GHSA-7xgj-8392-5q4r (post-transform component authorization skipped on direct calls)
    "fastmcp-slim>=3.4.10",  # Fix GHSA-7xgj-8392-5q4r
    "filelock>=4.2.1",  # Fix CVE-2026-112940 (ReadWriteLock symlink/journal overwrite), CVE-2026-112907/112913 (Windows side-file/oplock)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:There is no current event loop:DeprecationWarning:pydantic_ai\\._utils",
]
